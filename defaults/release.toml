# Pré-lançamentos de desenvolvimento (ADR 0025). Lido por tools/release.py e pelo workflow prerelease.yml.

# "on": quando o CI de um push na develop termina verde, publica um pré-lançamento (junções próximas podem sair
# num só, o do commit mais novo) e poda os antigos. "off": não publica nem poda nada.
enabled = "on"

# Versão estável que os pré-lançamentos antecedem (SemVer MAIOR.MENOR.CORREÇÃO). Sobe quando a versão estável sair.
base_version = "0.1.0"

# Identificador do pré-lançamento: versão "<base>-<channel>.<AAAAMMDD>.<N>+<commit curto>", tag "<tag_prefix><base>-<channel>.<AAAAMMDD>.<N>".
# O commit fica no título e no texto da release, não na tag, porque o "+" atrapalha links e ferramentas.
channel = "dev"
tag_prefix = "v"

# Quantos pré-lançamentos deste canal ficam guardados (1 a 100). Os mais antigos são apagados com a tag.
keep = 10

# "apply": apaga o excedente, a cada execução, com ou sem publicação nova. "dry-run": só lista no resumo da execução
# o que apagaria. "off": não poda.
prune = "apply"

# Após publicar, cada tentativa consulta a release pela tag e, quando ela aparece, busca a listagem completa
# para a retenção. A primeira tentativa é imediata. Ajuste o total (1 a 10) e o intervalo (1 a 15 segundos)
# conforme o atraso de propagação. Com os padrões abaixo há até 25 segundos de pausas, além do tempo das consultas.
# Se a listagem não confirmar a mesma release até a última tentativa, o job falha antes de emitir alvos.
wait_attempts = 6
wait_interval_seconds = 5
