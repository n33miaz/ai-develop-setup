# Padrão embutido do adaptador de API (chamadas diretas a provedores, formato Chat Completions).
# Quem escreve o arquivo de configuração do usuário só precisa das chaves que quer mudar; as demais
# valem como aqui. Nenhuma chave guarda segredo: a chave de API vem do cofre, por um apelido.

# Desligado por padrão. Ligar não basta: sem `monthly_cap_usd` o adaptador recusa toda chamada.
enabled = false

# Teto mensal de gasto estimado, em dólares (maior que zero). Sem valor, o adaptador recusa tudo.
# Ao atingir o teto, as chamadas seguintes são recusadas até o mês seguinte, e uma chamada só sai se o
# pior caso dela (entrada limitada pelo tamanho do pedido, saída pelo teto de tokens) cabe no que sobra.
# Exemplo, comentado de propósito: monthly_cap_usd = 20.0

# Caminho acrescentado à URL base do provedor.
chat_path = "/chat/completions"

# Nome do cabeçalho que leva a chave e o texto que vem antes dela. Só nomes: o valor da chave nunca
# passa por esta configuração.
key_header = "Authorization"
key_prefix = "Bearer "

# Teto de tokens de saída por chamada, usado quando o pedido não traz o seu e como limite máximo.
max_output_tokens = 1024

# Apelidos das chaves de API de cada provedor, para quem tem mais de uma. São nomes de referência no
# cofre, nunca o valor da chave. De 1 a 8, sem repetição; cada um com 1 a 32 caracteres (letras
# minúsculas, dígitos, - e _, começando por letra). Texto com cara de segredo (prefixo comum de
# chave, ou 16 ou mais letras e dígitos seguidos com algum dígito) é recusado sem aparecer na
# mensagem de erro. Quem tem uma chave só não precisa mexer.
key_aliases = ["default"]

# O nome da tabela é o apelido gravado no registro de uso (letras, dígitos e . _ : -).
# A mesma verificação de texto com cara de segredo dos apelidos de chave vale aqui. Sem provedor
# configurado não há chamada possível. As tarifas de entrada e saída aceitam de zero a um bilhão
# de dólares por milhão de tokens, em múltiplos exatos de 0,000001. O campo `price_version`
# identifica a tabela de preços usada, para o livro-caixa. `chat_path`, `key_header`, `key_prefix`,
# `max_output_tokens` e `key_aliases` podem ser trocados por provedor.
#
# `active_key` (só dentro do provedor) diz qual apelido está em uso: precisa estar na lista, é
# obrigatória com mais de um apelido e dispensável com um só. A chamada usa a referência
# `<provedor>/<apelido>`. A troca é manual, mudando `active_key`: não há rotação nem troca automática
# quando uma chamada falha. O teto mensal é um só para o adaptador, qualquer que seja a chave.
# Exemplo, comentado de propósito:
#
# [providers.provider-a]
# base_url = "https://api.example.com/v1"
# model = "model-x"
# input_usd_per_mtok = 2.5
# output_usd_per_mtok = 10.0
# price_version = "prices-2030-01-01"
# key_aliases = ["personal", "work"]
# active_key = "personal"
