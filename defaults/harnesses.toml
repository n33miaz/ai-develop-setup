# Parametros das ferramentas de linha de comando que o produto abre num terminal (P8). Lido pelos
# adaptadores de ferramenta (`ads-adapter-claude` e `ads-adapter-codex`; embutido na compilacao como
# padrao). O arquivo do usuario, com o caminho real de cada programa e as pastas, fica FORA do
# repositorio, e passado ao daemon por `--config` e sobrepoe este.
#
# O que NAO e parametro, porque vale sempre: quem pede a sessao escolhe so a ferramenta (pelo nome), o
# apelido da pasta e o tamanho; nunca programa, argumento, variavel de ambiente nem pasta. O filho nao
# herda nada do processo pai alem do que [env] deixa passar.

# Ambiente do processo filho. A comparacao com `allow` ignora maiusculas no Windows; com `deny`, sempre.
[env]

# Variaveis copiadas do processo pai, se existirem. A camada do usuario SUBSTITUI a lista.
# Padrao: o minimo para um programa do Windows achar o sistema, o PATH, a pasta do usuario e a
# temporaria. Nada de credencial: o login de cada ferramenta fica com ela, fora do produto.
# Linux e macOS: a lista nao tem `HOME` nem `TMPDIR` (a pasta temporaria nesses sistemas). A
# ferramenta costuma achar a propria pasta pelo sistema mesmo sem `HOME`, mas git, npm e outros
# programas que ela abre leem `HOME` (`~/.gitconfig`, `~/.npmrc`) e, sem ele, rodam sem a
# configuracao da pessoa. Como a camada do usuario SUBSTITUI `allow`, o arquivo do usuario escreve a
# lista inteira que quer passar, por exemplo:
#   [env]
#   allow = ["PATH", "HOME", "TMPDIR", "LANG", "USER"]
allow = [
  "SystemRoot",
  "windir",
  "ComSpec",
  "PATH",
  "PATHEXT",
  "USERPROFILE",
  "APPDATA",
  "LOCALAPPDATA",
  "HOMEDRIVE",
  "HOMEPATH",
  "TEMP",
  "TMP",
]

# Nomes que nunca passam. `NOME` exato, `PREFIXO*`, `*SUFIXO` ou `*TRECHO*`; sem diferenca de
# maiusculas, nem nas letras Unicode que viram as do padrao (s longo, i sem ponto, largura cheia). Nome
# em `allow` ou em `env.set` que case com um destes e recusado na carga. Esta lista so cresce: a camada
# do usuario ACRESCENTA padroes, nunca tira.
# Cobre o nome de credenciais (chave, token, segredo, senha), o nome de variaveis que APONTAM para elas
# (`*_TOKEN_FILE`, `*_KEY_FILE`, `*_CREDENTIALS`, `KUBECONFIG`) e a configuracao de login das
# ferramentas e provedores (`CLAUDE_CONFIG_DIR`, `GOOGLE_APPLICATION_CREDENTIALS`). Um padrao de nome nao
# reconhece um segredo guardado sob um nome qualquer: o que passa e so o que esta em `allow`.
deny = [
  # Credenciais pelo nome, em qualquer posicao.
  "*TOKEN*",
  "*SECRET*",
  "*PASSWORD*",
  "*PASSWD*",
  "*CREDENTIAL*",
  "*API_KEY*",
  "*APIKEY*",
  "*PRIVATE_KEY*",
  "*_KEY",
  "*_KEY_FILE",
  "*_KEYS",
  "*_PAT",
  "*_PAT_*",
  "*_AUTH*",
  "*_PASS*",
  "*_SESSION*",
  "*_COOKIE*",
  "*_JWT*",
  "*_PWD",
  "MYSQL_PWD",
  "*_DSN",
  "*_KEY_ID",
  "AUTHORIZATION",
  # Variaveis que levam a credencial dentro do valor ou apontam para o arquivo dela.
  "DATABASE_URL",
  "KUBECONFIG",
  # Ferramentas e provedores: login, configuracao de login e chaves.
  "ANTHROPIC_*",
  "CLAUDE_*",
  "OPENAI_*",
  "CODEX_*",
  "GEMINI_*",
  "GOOGLE_*",
  "GCLOUD_*",
  "CLOUDSDK_*",
  "VERTEX_*",
  "AWS_*",
  "AZURE_*",
  "GH_*",
  "GITHUB_*",
  "COPILOT_*",
  "MISTRAL_*",
  "COHERE_*",
  "GROQ_*",
  "OPENROUTER_*",
  "HF_*",
  "HUGGING_FACE_*",
]

# Valores que o proprio produto define (nao vem do pai). A camada do usuario SUBSTITUI a tabela.
# Nenhum pode casar com `deny`.
[env.set]
TERM = "xterm-256color"
COLORTERM = "truecolor"

# Pastas de trabalho por apelido: `apelido = "caminho absoluto"`. Quem pede a sessao manda so o
# apelido; apelido que nao esta aqui e recusado. A camada do usuario ACRESCENTA ou troca apelidos.
# Apelido: letras, digitos e . _ : -, ate 64 caracteres. Padrao vazio: nenhuma pasta.
# A raiz de uma unidade (`C:\`) ou `/` e recusada: a ferramenta trabalharia no disco inteiro.
[workdirs]

[accounts]
# No arquivo do usuario: [accounts.<ferramenta>.<apelido>] com profile_dir absoluto.
# Sem perfis no padrao. Antigravity permanece manual.

# Uma tabela por ferramenta. Cada adaptador le so a sua.
[tools.claude]

# Caminho ABSOLUTO do programa, que precisa existir quando a sessao abre. Vazio (padrao): ferramenta
# desligada. Caminho relativo, com variavel (`%VAR%`, `$VAR`), `~` ou `..` e recusado.
program = ""

# Argumentos fixos passados ao programa, sempre os mesmos. Padrao vazio.
args = []

# Modo de uso. So `interactive` (terminal operado pela pessoa) e aceito por enquanto.
mode = "interactive"

# Limiar da cota observada (1 a 100). A configuracao ainda nao aciona a troca.
switch = "propose"
switch_at_pct = 90

# Mesmas chaves e regras de `[tools.claude]`.
[tools.codex]
program = ""
args = []
mode = "interactive"
switch = "propose"
switch_at_pct = 90
