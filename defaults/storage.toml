# Camada sobreposta em tempo de abertura; mudanças valem ao reabrir.
# Padrão recomendado: 5 s; intervalo permitido: 0..=60000 ms.
# Também limita a espera por -journal ou -wal sobrando ao abrir: parados durante
# a segunda metade do prazo recusam com Corrupt; mudando nessa metade recusam com
# Busy; 0 recusa na hora com Busy. Com o timeout do SQLite, a abertura pode esperar cerca do dobro.
busy_timeout_ms = 5000
# Verificação completa antes de migrar; desligar reduz o custo de abertura.
integrity_check_on_open = true
# Apenas estes formatos são suportados; alternativas exigem migração e ADR.
encryption = "column"
cipher = "xchacha20poly1305"
journal_mode = "wal"
# Teto da imagem de inspeção em memória, usada só em arquivo ainda não marcado
# pelo produto: recomendado 64 MiB. Aceita 512 bytes a 1 GiB; exceder recusa
# com Full, sem tocar o banco. Arquivo do produto não passa pela imagem.
inspection_max_bytes = 67108864
# Teto do `data` de um evento, medido em bytes do JSON serializado antes da
# cifra: recomendado 1 MiB. Aceita 64 bytes a 16 MiB; maior recusa com TooLarge
# sem escrever. Evento grande demais pede outro lugar (anexo), não teto maior.
max_event_bytes = 1048576
# Máximo de eventos que uma leitura de stream decifra de uma vez: recomendado
# 500. Aceita 1 a 10000; pedido maior devolve só este tanto, e quem lê continua
# do último seq recebido.
read_page_limit = 500
# Teto, em bytes de texto cifrado, do que uma leitura de stream decifra de uma
# vez: recomendado 8 MiB. Aceita de max_event_bytes a 256 MiB. A página para
# antes do evento que passaria do teto (o primeiro sempre entra, mesmo maior), e
# quem lê continua do último seq recebido. O teto conta texto cifrado, não
# memória: os eventos devolvidos ficam como JSON interpretado, que pode ocupar
# várias vezes mais (estimativa, não medida: até 10 a 20 vezes).
read_page_max_bytes = 8388608

# Candidatos a chave alternativa por linha após falha de leitura.
# Recomendado 8. Aceita 0 a 128; 0 preserva o erro original sem procurar.
read_key_candidates = 8

# Quando um append ancorado autentica de novo a cadeia guardada, sem decifrar.
# Recomendado "changed": custo constante, revalida só quando outra conexão
# SQLite confirmou mudanças (PRAGMA data_version). Escrita direta nos bytes do
# arquivo não muda esse valor e só é detectada na próxima abertura ou em
# verify_chain. "always" revalida em todo append, com custo proporcional aos
# bytes guardados e dentro do lock de escrita. Outro valor recusa.
verify_on_append = "changed"
