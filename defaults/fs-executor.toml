# Parametros do executor de acoes de sistema de arquivos (P8). Lido por `ads-adapter-fs` (embutido na
# compilacao como padrao; uma camada do usuario pode sobrepor qualquer chave, e a que faltar cai no valor daqui).
# Formato: uma chave por linha, `chave = valor`, sem tabelas.
#
# O que NAO e parametro, porque vale sempre: a cerca, a recusa de link no caminho, a reconferencia antes de
# cada alteracao e a recusa de sobrescrever.

# Profundidade maxima, em pastas, de uma arvore que o executor mede, move ou apaga. Arvore mais funda e
# recusada antes de qualquer alteracao.
max_depth = 128

# Maior manifesto de quarentena que o executor le, em bytes. Manifesto maior e recusado.
max_manifest_bytes = 16777216
