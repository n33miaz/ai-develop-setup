# Origens exatas da interface; sem curingas. Trocar exige reconectar a interface.
ui_base_url = "http://127.0.0.1:5173"
# Vazia: deriva somente a origem da URL base. Lista explícita substitui a derivação.
allowed_origins = []
auth_timeout_ms = 5000
# Limites por execução. Fechar no host libera a vaga, inclusive de sessão já encerrada. O histórico fechado tem limite separado.
max_sessions = 32
max_write_bytes = 65536
events_per_stream = 256
idempotency_keys = 1024
# Filas e conexões limitam memória e clientes lentos.
command_queue = 64
max_connections = 32
max_pending_auth = 32
accept_retry_ms = 50
max_message_bytes = 131072
send_timeout_ms = 5000
host_timeout_ms = 10000
# Limite de lápides (ids podados que não podem ser reabertos nesta execução; acima disso o mais antigo volta a valer)
# e, em separado, de streams assinados antes do session.open à espera da sessão.
retired_sessions = 1024
# Ids de assinatura por conexão: este valor vezes max_sessions. Reassinar um stream na mesma conexão soma um id.
subscription_ids_per_stream = 2
# Fechamento automático de sessão invalidada: tentativas e espera entre elas; esgotadas, a assinatura recebe SESSION_CLOSE_PENDING.
close_retries = 3
close_retry_ms = 1000
