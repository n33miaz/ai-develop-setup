# Origens exatas da interface; sem curingas. Trocar exige reconectar a interface.
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
auth_timeout_ms = 5000
# Limites por execução. Streams encerrados ocupam uma vaga até reiniciar o daemon.
max_sessions = 32
max_write_bytes = 65536
events_per_stream = 256
idempotency_keys = 1024
# Filas e conexões limitam memória e clientes lentos.
command_queue = 64
max_connections = 32
max_message_bytes = 131072
send_timeout_ms = 5000
host_timeout_ms = 10000
