[package]
name = "ads-daemon"
description = "Composition root: wires the core, the adapters and the local HTTP/WebSocket API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ads-contracts = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tokio-tungstenite = { workspace = true }
zeroize = { workspace = true }
ads-ptyhost = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
