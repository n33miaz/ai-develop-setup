[package]
name = "ads-daemon"
description = "Composition root: wires the core, the adapters and the local HTTP/WebSocket API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ads-ptyhost = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
