[package]
name = "ads-shell"
description = "Tauri shell: window, tray icon and panel; a thin client of the core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[features]
desktop-smoke = []

# Copia dos lints do workspace com `unsafe_code` em "deny" no lugar de "forbid": as chamadas do sistema
# ficam num unico modulo (`stdin`), que libera o lint. Ver docs/unsafe.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
ads-contracts = { workspace = true, features = ["desktop-proof"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tokio-tungstenite.workspace = true
zeroize.workspace = true
tauri = { workspace = true, features = ["custom-protocol"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
tauri-build.workspace = true
