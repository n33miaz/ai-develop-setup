[package]
name = "ads-testkit"
description = "Test-only helpers: a child test process that stands in for a server of another account."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Only ever a dev-dependency: nothing here reaches a product binary (docs/unsafe.md).

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

# Copia dos lints do workspace com `unsafe_code` em "deny" no lugar de "forbid": as chamadas do sistema
# ficam num unico modulo (`win`), que libera o lint. Ver docs/unsafe.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
