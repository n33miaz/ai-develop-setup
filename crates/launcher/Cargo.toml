[package]
name = "ads-launcher"
description = "Stable supervisor that starts the other processes and applies updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ads-private-dir.workspace = true
ads-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
ads-private-dir = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
