# Portao de licencas, avisos de seguranca e origem das bibliotecas (cargo-deny 0.20.2, rodado no CI).
# Licenca do produto: proprietaria, codigo aberto a vista. Entram MIT, Apache-2.0, BSD, ISC, Zlib e Unicode;
# GPL e AGPL nunca; MPL-2.0 so por excecao nomeada abaixo, com a decisao em docs/adr/0018-*.md.

[graph]
# Plataformas avaliadas: o produto roda no Windows. Acrescente "x86_64-unknown-linux-gnu" quando existir
# o fixture em Linux (traz as bibliotecas gtk do Tauri, com avisos proprios).
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Cada ignorado leva o motivo e a condicao para sair da lista. Hoje nenhum.
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# Crates proprios do workspace nao tem licenca SPDX e nao sao publicados.
[licenses.private]
ignore = true

# Excecoes de licenca (ADR 0018): so estes crates, so esta licenca. Todos vem da arvore do Tauri.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
# O Tauri traz versoes duplicadas; so avisa.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
