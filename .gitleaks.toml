title = "ai-develop-setup gitleaks"

# Usa as regras padrão do gitleaks e só acrescenta exceções explícitas e mínimas.
[extend]
useDefault = true

# Exceções explícitas e mínimas. Qualquer outra entra por PR, com o motivo aqui e na issue.
# 1. O modelo de variáveis, que tem só nomes e nenhum valor real (AGENTS.md).
# 2. A chave de idempotência de um comando: é um ULID (identificador ordenável, não segredo), e a regra genérica de
#    chave de API casa com os exemplos sintéticos dos contratos pelo nome do campo. A expressão olha somente o trecho detectado pela regra.
# 3. A chave de exemplo do handshake WebSocket da RFC 6455 (base64 de "the sample nonce"), pública, usada em testes
#    que montam o pedido HTTP à mão. Só esse valor exato é aceito.
[allowlist]
description = "modelo de variáveis sem valores e chave de exemplo da RFC 6455"
paths = ['''(^|/)\.env\.example$''']
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "chave de idempotência em formato ULID"
regexTarget = "match"
regexes = ['''(?:^|[^\w.-])idempotency_key":\s*"[0-9A-HJKMNP-TV-Z]{26}"''']
