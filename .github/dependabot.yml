# Atualizações de dependências. Os PRs miram a develop (branch padrão), uma vez por semana, com as atualizações
# menores e de correção agrupadas por ecossistema; as maiores chegam sozinhas, para serem avaliadas uma a uma.
# O dono do repositório entra como coautor pelo workflow dependabot-coauthor.yml (parâmetro em defaults/dependencies.toml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["type: chore", "area: process"]
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["type: chore", "area: ui"]
    commit-message:
      prefix: build
      include: scope
    groups:
      ui-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["type: chore", "area: contracts"]
    commit-message:
      prefix: build
      include: scope
    groups:
      contracts-minor-patch:
        update-types: [minor, patch]

  # Actions fixadas por SHA: o Dependabot troca o SHA e o comentário de versão juntos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["type: ci", "area: process"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
