name: Tarefa
description: Uma entrega do projeto (uma issue por entrega, aberta antes do trabalho).
body:
  - type: markdown
    attributes:
      value: |
        **Esta issue é pública.** Não cole dados pessoais, nomes de pessoas ou de empresas, e-mails, caminhos da sua máquina, tokens ou segredos. Descreva o pedido em termos genéricos.
        **Título:** em inglês, descreve o problema ou o resultado esperado, no imperativo ou como frase nominal, com inicial maiúscula, sem prefixo `tipo(escopo):` (isso é de commit), sem ponto final, até 72 caracteres. Exemplos: "Prevent deletions outside the workspace", "Terminal host loses output when the client reconnects".
        **Classificação:** escolha o tipo e a área abaixo e aplique os rótulos correspondentes (`type: ...` e `area: ...`) ao abrir a issue; o formulário não aplica rótulo sozinho. A lista está no CONTRIBUTING.md.
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      description: O rótulo `type:` desta entrega.
      options:
        - "type: feature"
        - "type: fix"
        - "type: chore"
        - "type: docs"
        - "type: test"
        - "type: ci"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: O rótulo `area:` de cada módulo que a entrega toca (ver docs/modules.md).
      multiple: true
      options:
        - "area: contracts"
        - "area: core"
        - "area: storage"
        - "area: ptyhost"
        - "area: daemon"
        - "area: launcher"
        - "area: shell"
        - "area: e2e"
        - "area: adapters"
        - "area: ui"
        - "area: process"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: O que esta entrega resolve, em poucas linhas.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critério de aceite
      description: Como saberemos que está pronto, de forma verificável (teste, comando, comportamento observado). Miudezas da mesma entrega entram aqui como checklist.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Princípios tocados
      description: Marque os que esta entrega afeta (detalhes em AGENTS.md).
      options:
        - label: P1 Coesão
        - label: P2 Acoplamento
        - label: P3 Segurança
        - label: P4 Prevenção
        - label: P5 Mitigação de riscos
        - label: P6 Reparo
        - label: P7 Melhora contínua
        - label: P8 Parametrização
  - type: textarea
    id: notes
    attributes:
      label: Notas
      description: Riscos, dependências ou decisões pendentes. Opcional.
    validations:
      required: false
