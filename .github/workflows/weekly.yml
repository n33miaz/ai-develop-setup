name: Weekly

# Verificações agendadas fora do ci-ok. CodeQL e Scorecard publicam na aba Security.
# Consulte os jobs de dependências para ver os avisos do RustSec e do registro npm.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: rust-advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Avisos para o alvo Windows
        run: cargo deny --locked check advisories
      - name: Avisos para o alvo Linux sem a casca
        if: ${{ !cancelled() }}
        run: cargo deny --locked --target x86_64-unknown-linux-gnu --exclude ads-shell check advisories

  npm-advisories:
    name: npm-advisories (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [ui, contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verificar dependências do npm
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Workflows, os pacotes JavaScript/TypeScript (ui/ e contracts/) e os crates Rust, todos com build-mode none.
        # As três linguagens estão na lista embutida da versão fixada abaixo (src/languages/builtin.json no SHA; CLI 2.27.3).
        # Linguagem nova no repositório entra aqui na mesma entrega que a traz.
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Permissões exatas do modelo oficial do OpenSSF Scorecard.
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rodar a análise
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
