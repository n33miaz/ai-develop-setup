name: CI

# Modo expresso: só bloqueia o que roda rápido (alvo: até 5 minutos). O job `ci-ok` é o único check exigido na develop.
on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: commits
    # Só em PR para a develop, a porta de entrada. Robôs ficam de fora (as mensagens deles não passam pelo hook).
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Testar o próprio checador
        run: bash .github/scripts/check-commits.test.sh
      - name: Conferir o padrão dos commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # O nome da branch vem de fora: entra por variável de ambiente, nunca interpolado no comando.
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA" --branch "$HEAD_REF"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A configuração é .gitleaks.toml, na raiz. A push protection do GitHub é a segunda camada.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # As exceções de .gitleaks.toml são testadas com o binário real sobre amostras geradas na hora, com e sem a
      # configuração do repo. Versão e soma SHA-256 fixas; sem o binário, o teste falha aqui (fora daqui ele é pulado).
      - name: Testar as exceções com o gitleaks real
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          GITLEAKS_REQUIRED: "1"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSLf --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" python3 -m unittest discover -s tools -p 'test_gitleaks_config.py' -v

  terms:
    name: terms
    # Desligado por padrão: a lista de termos é privada e, enquanto o mantenedor não decidir guardá-la como segredo
    # do repositório, a conferência roda só na máquina dele, antes de cada push. Para ligar aqui: criar o segredo
    # FORBIDDEN_TERMS e a variável de repositório TERMS_CHECK = on. Ligado, o job falha fechado.
    if: vars.TERMS_CHECK == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A lista de termos proibidos vive num segredo do repositório (FORBIDDEN_TERMS), fora do git. Uma linha por regra;
      # linhas vazias e as que começam com # são ignoradas; prefixo `re:` marca expressão regular (Python `re`), o resto é
      # texto literal casado por palavra inteira, sem diferença de maiúscula, com `\` e `/` valendo como o mesmo separador
      # (as mesmas regras do verificador local). Falha fechado: lista ausente, vazia ou com regra inválida reprova; PR vindo
      # de fork não recebe segredos e também reprova (contribuição externa está fechada). Nunca imprime os termos nem onde
      # casaram: só as contagens. Varre os arquivos rastreados e as mensagens dos commits do PR.
      - name: Procurar termos proibidos
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)

          raw = os.environ.get("FORBIDDEN_TERMS", "")
          if not raw.strip():
              fail("lista de termos ausente ou vazia; falha fechada.")

          rules = []
          for n, line in enumerate(raw.splitlines(), 1):
              t = line.rstrip("\r")
              if not t.strip() or t.startswith("#"):
                  continue
              try:
                  if t.startswith("re:"):
                      rx = t[3:]
                  else:
                      sep = "[\\/]"
                      rx = "".join(sep if ch in ("\\", "/") else re.escape(ch) for ch in t)
                      if t[0].isalnum():
                          rx = r"(?<![^\W_])" + rx
                      if t[-1].isalnum():
                          rx = rx + r"(?![^\W_])"
                  rules.append((n, re.compile(rx, re.I)))
              except re.error:
                  fail("regra inválida na linha %d da lista; falha fechada." % n)
          if not rules:
              fail("a lista não tem nenhuma regra; falha fechada.")

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.split(b"\0")
          texts = []
          for f in files:
              if not f:
                  continue
              try:
                  with open(f, "rb") as fh:
                      texts.append(fh.read().decode("utf-8", errors="ignore"))
              except OSError:
                  pass
          base, head = os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", "")
          if base and head:
              out = subprocess.run(["git", "log", "--format=%B", base + ".." + head], capture_output=True, check=True)
              texts.append(out.stdout.decode("utf-8", errors="ignore"))

          hit = sum(1 for _, rx in rules if any(rx.search(t) for t in texts))
          print("regras lidas: %d; regras com casamento: %d; arquivos varridos: %d" % (len(rules), hit, len(texts)))
          if hit:
              fail("%d regra(s) da lista de termos proibidos casaram." % hit)
          PY

  # ---------------------------------------------------------------------------------------------------------
  # Entram depois, cada um com o gatilho que o liga. Mantenha o filtro por caminho para não
  # rodar o que não mudou, e inclua o job novo em `needs` do ci-ok.
  #
  # artifact:    gatilho = o atualizador do daemon existir. Gera o executável, o SHA-256 e a atestação a cada junção
  #              na develop (runner Windows) e publica como pré-lançamento.
  # ---------------------------------------------------------------------------------------------------------

  # Decide, por `git diff`, quais jobs condicionais rodam. É um job (e não `on.paths`) para o `ci-ok` existir sempre.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      ui: ${{ steps.filter.outputs.ui }}
      contracts: ${{ steps.filter.outputs.contracts }}
      pty: ${{ steps.filter.outputs.pty }}
      fs: ${{ steps.filter.outputs.fs }}
      storage: ${{ steps.filter.outputs.storage }}
      vault: ${{ steps.filter.outputs.vault }}
      launcher: ${{ steps.filter.outputs.launcher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filtrar por caminho
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          # Casca: janela, interface, processos do teste, dependências e entradas da compilação.
          SHELL_PATHS: '^(crates/(shell|launcher|daemon|ptyhost)/|crates/(core|storage|testkit|private-dir)/|crates/adapters/(claude|codex|vault|fs)/|ui/|tools/smoke_desktop\.py$|crates/contracts/|crates/e2e/|contracts/|defaults/(action-gate|budget|handoff|harnesses|queue|refusal|routing|daemon|fs-executor|launcher|ptyhost|storage)\.toml$|\.github/workflows/ci\.yml$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
          # Interface: ela mesma e o que ela lê dos contratos (tipos gerados e os Schemas do teste de contrato).
          UI_PATHS: '^(ui/|contracts/generated/|contracts/schemas/)'
          # Contratos: os Schemas e as ferramentas, os tipos Rust gerados deles e o que muda a forma como o rustfmt os escreve.
          CONTRACTS_PATHS: '^(contracts/|crates/contracts/|rust-toolchain\.toml$|rustfmt\.toml$)'
          # PTY: host, daemon, adaptadores ligados a ele, núcleo, contratos, parâmetros, workflow e entradas da compilação.
          PTY_PATHS: '^(crates/ptyhost/|crates/daemon/|crates/testkit/|crates/contracts/|crates/adapters/(claude|codex|vault|fs)/|crates/storage/|crates/core/|crates/private-dir/|contracts/|defaults/(action-gate|budget|handoff|harnesses|queue|refusal|routing|daemon|fs-executor|ptyhost|storage)\.toml$|\.github/workflows/ci\.yml$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
          # Executor de arquivos: o crate, o portão que ele julga de novo, os parâmetros dos dois, este workflow e
          # tudo que muda o resultado da compilação.
          FS_PATHS: '^(crates/adapters/fs/|crates/core/|crates/contracts/|contracts/|defaults/(action-gate|budget|handoff|harnesses|queue|refusal|routing|fs-executor)\.toml$|\.github/workflows/ci\.yml$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
          STORAGE_PATHS: '^(crates/storage/|crates/core/|crates/contracts/|contracts/|defaults/(action-gate|budget|handoff|harnesses|queue|refusal|routing|storage)\.toml$|\.github/workflows/ci\.yml$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
          # Cofre: o crate, as dependências dele no workspace, este workflow e as entradas da compilação.
          VAULT_PATHS: '^(crates/adapters/vault/|crates/core/|crates/contracts/|contracts/|defaults/(action-gate|budget|handoff|harnesses|queue|refusal|routing)\.toml$|\.github/workflows/ci\.yml$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
          # Lançador: o crate, as dependências dele no workspace, os parâmetros dele, este workflow e as entradas da compilação.
          LAUNCHER_PATHS: '^(crates/launcher/|crates/core/|crates/private-dir/|crates/contracts/|contracts/|defaults/(action-gate|budget|handoff|harnesses|queue|refusal|routing|launcher)\.toml$|\.github/workflows/ci\.yml$|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
        run: |
          set -euo pipefail
          # Na dúvida (disparo manual, push sem base conhecida, diff impossível), roda.
          shell=true
          ui=true
          contracts=true
          pty=true
          fs=true
          storage=true
          vault=true
          launcher=true
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE_SHA...$PR_HEAD_SHA" ;;
            push)
              case "$PUSH_BEFORE_SHA" in
                ""|0000000000000000000000000000000000000000) ;;
                *) range="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA" ;;
              esac
              ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            echo "$files"
            if echo "$files" | grep -Eq "$SHELL_PATHS"; then shell=true; else shell=false; fi
            if echo "$files" | grep -Eq "$UI_PATHS"; then ui=true; else ui=false; fi
            if echo "$files" | grep -Eq "$CONTRACTS_PATHS"; then contracts=true; else contracts=false; fi
            if echo "$files" | grep -Eq "$PTY_PATHS"; then pty=true; else pty=false; fi
            if echo "$files" | grep -Eq "$FS_PATHS"; then fs=true; else fs=false; fi
            if echo "$files" | grep -Eq "$STORAGE_PATHS"; then storage=true; else storage=false; fi
            if echo "$files" | grep -Eq "$VAULT_PATHS"; then vault=true; else vault=false; fi
            if echo "$files" | grep -Eq "$LAUNCHER_PATHS"; then launcher=true; else launcher=false; fi
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "pty=$pty" >> "$GITHUB_OUTPUT"
          echo "fs=$fs" >> "$GITHUB_OUTPUT"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "vault=$vault" >> "$GITHUB_OUTPUT"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          echo "shell-check roda: $shell; ui roda: $ui; contracts roda: $contracts; pty-windows roda: $pty; fs-windows roda: $fs; storage-windows roda: $storage; vault-windows roda: $vault; launcher-windows roda: $launcher"

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Instalar as dependências fixadas
        run: npm ci --ignore-scripts
      # O gerador dos tipos Rust formata a saída com o rustfmt da versão fixada em rust-toolchain.toml.
      - name: Instalar o rustfmt da versão fixada
        working-directory: .
        run: |
          rustup toolchain install
          rustfmt --version
      - name: Testes do validador e dos geradores
        run: npm test
      - name: Schemas, URNs e arquivos dourados
        run: npm run validate
      - name: Tipos gerados em dia (TypeScript e Rust)
        run: npm run gen:check

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      # Sem --workspace de propósito: a casca Tauri fica de fora (default-members) e compila no job shell-check.
      - name: Formatação
        run: cargo fmt --all --check
      - name: Lint (avisos como erro)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Testes
        run: cargo test --locked
      - name: Regra de dependência (testes da ferramenta e conferência do grafo)
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_deps.py check
      # Versão fixa da ferramenta; configuração em deny.toml (licenças, avisos de segurança, origem).
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny
        run: cargo deny --locked check
      # O deny.toml avalia o alvo Windows. O executor de arquivos tem dependência só do Linux (rustix):
      # mesmas regras, alvo Linux, sem a casca Tauri (a árvore gtk dela pede decisão própria).
      - name: cargo-deny (alvo Linux, sem a casca)
        run: cargo deny --locked --target x86_64-unknown-linux-gnu --exclude ads-shell check

  shell-check:
    name: shell-check
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: shell-check
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Compilar a interface
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Lint da casca
        run: cargo clippy --locked -p ads-shell --all-targets -j 2 -- -D warnings
      - name: Testar a casca
        run: cargo test --locked -j 2 -p ads-shell
      - name: Compilar os processos do teste de conexão
        run: cargo build --locked -j 2 -p ads-shell -p ads-daemon -p ads-ptyhost --features ads-shell/desktop-smoke
      - name: Abrir a janela e consultar os adaptadores da API local
        run: python -B tools/smoke_desktop.py

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Só o que está no package-lock.json, sem rodar scripts de instalação de terceiros.
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Licenças das dependências diretas
        run: npm run licenses
      - name: Lint e formatação
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  # ConPTY real e Job Object só existem no Windows: os testes do ptyhost (com os 20 ciclos de abrir e fechar
  # sessão), o cliente do daemon, os parâmetros de abertura das ferramentas e o lint do código exclusivo do
  # Windows rodam aqui (ADR 0013).
  pty-windows:
    name: pty-windows
    needs: changes
    if: needs.changes.outputs.pty == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pty-windows
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      - name: Lint do ptyhost e do cliente no Windows (avisos como erro)
        run: cargo clippy --locked -p ads-ptyhost -p ads-daemon -p ads-testkit --all-targets -j 2 -- -D warnings
      - name: Testes do ptyhost (inclui os 20 ciclos de ConPTY)
        run: cargo test --locked -p ads-ptyhost -p ads-testkit -j 2 -- --nocapture
      - name: Compilar o binário usado pelo cliente do daemon
        run: cargo build --locked -p ads-ptyhost -j 2
      - name: Testes do cliente do daemon (inclui o binário real)
        run: cargo test --locked -p ads-daemon -j 2 -- --nocapture
      - name: Parâmetros de abertura das ferramentas (caminhos e ambiente do Windows)
        run: |
          cargo test --locked -p ads-core --lib --test child_env -j 2
          cargo test --locked -p ads-adapter-claude -p ads-adapter-codex -j 2

  # Junção, ponto de reanálise e a remoção de link de pasta só existem no Windows: os testes do executor de
  # arquivos rodam aqui também (no Linux eles já rodam no job `rust`), e só quando uma entrada do job muda (ADR 0013).
  fs-windows:
    name: fs-windows
    needs: changes
    if: needs.changes.outputs.fs == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fs-windows
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      - name: Lint do executor no Windows (avisos como erro)
        run: cargo clippy --locked -p ads-adapter-fs --all-targets -- -D warnings
      - name: Testes do executor (inclui a junção)
        run: cargo test --locked -p ads-adapter-fs -- --nocapture
      - name: Forma canônica dos efeitos com a ordem de inserção do serde_json ligada
        run: cargo test --locked -p ads-adapter-fs --lib --features serde_json/preserve_order canonical_form

  storage-windows:
    name: storage-windows
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: storage-windows
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      - name: Lint e testes do armazenamento no Windows
        run: |
          cargo clippy --locked -p ads-storage --all-targets -j 2 -- -D warnings
          cargo test --locked -p ads-storage -j 2

  # O Gerenciador de Credenciais só existe no Windows: no Linux o cofre compila com o stub, então o código real
  # (e o unsafe dele) só é compilado e testado aqui. O teste que grava no cofre de verdade fica ignorado.
  vault-windows:
    name: vault-windows
    needs: changes
    if: needs.changes.outputs.vault == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: vault-windows
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      - name: Lint do cofre no Windows (avisos como erro)
        run: cargo clippy --locked -p ads-adapter-vault --all-targets -j 2 -- -D warnings
      - name: Testes do cofre (sem o teste ignorado)
        run: cargo test --locked -p ads-adapter-vault -j 2

  # O lançador supervisiona processos e aplica atualizações no Windows: o lint e os testes rodam aqui também
  # (no Linux eles já rodam no job `rust`), e só quando uma entrada do job muda. As pastas privadas, que ele
  # usa, têm o código Windows (`platform/win.rs`) conferido aqui.
  launcher-windows:
    name: launcher-windows
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a versão fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: launcher-windows
          save-if: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
      - name: Lint do lançador e das pastas privadas no Windows (avisos como erro)
        run: cargo clippy --locked -p ads-launcher -p ads-private-dir --all-targets -j 2 -- -D warnings
      - name: Testes do lançador e das pastas privadas
        run: cargo test --locked -p ads-launcher -p ads-private-dir -j 2

  ci-ok:
    name: ci-ok
    if: always()
    needs: [commits, secrets, terms, changes, contracts, rust, shell-check, ui, pty-windows, fs-windows, storage-windows, vault-windows, launcher-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resumir
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error::algum job falhou ou foi cancelado."
              exit 1
              ;;
          esac
