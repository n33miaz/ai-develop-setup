name: CI

# Modo expresso: s√≥ bloqueia o que roda r√°pido (alvo: at√© 5 minutos). O job `ci-ok` √© o √∫nico check exigido na develop.
on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commits
    # S√≥ em PR para a develop, a porta de entrada. Rob√¥s ficam de fora (as mensagens deles n√£o passam pelo hook).
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Testar o pr√≥prio checador
        run: bash .github/scripts/check-commits.test.sh
      - name: Conferir o padr√£o dos commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A configura√ß√£o √© .gitleaks.toml, na raiz. A push protection do GitHub √© a segunda camada.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terms:
    name: terms
    # Desligado por padr√£o: a lista de termos √© privada e, enquanto o mantenedor n√£o decidir guard√°-la como segredo
    # do reposit√≥rio, a confer√™ncia roda s√≥ na m√°quina dele, antes de cada push. Para ligar aqui: criar o segredo
    # FORBIDDEN_TERMS e a vari√°vel de reposit√≥rio TERMS_CHECK = on. Ligado, o job falha fechado.
    if: vars.TERMS_CHECK == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A lista de termos proibidos vive num segredo do reposit√≥rio (FORBIDDEN_TERMS), fora do git. Uma linha por regra;
      # linhas vazias e as que come√ßam com # s√£o ignoradas; prefixo `re:` marca express√£o regular (Python `re`), o resto √©
      # texto literal casado por palavra inteira, sem diferen√ßa de mai√∫scula, com `\` e `/` valendo como o mesmo separador
      # (as mesmas regras do verificador local). Falha fechado: lista ausente, vazia ou com regra inv√°lida reprova; PR vindo
      # de fork n√£o recebe segredos e tamb√©m reprova (contribui√ß√£o externa est√° fechada). Nunca imprime os termos nem onde
      # casaram: s√≥ as contagens. Varre os arquivos rastreados e as mensagens dos commits do PR.
      - name: Procurar termos proibidos
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)

          raw = os.environ.get("FORBIDDEN_TERMS", "")
          if not raw.strip():
              fail("lista de termos ausente ou vazia; falha fechada.")

          rules = []
          for n, line in enumerate(raw.splitlines(), 1):
              t = line.rstrip("\r")
              if not t.strip() or t.startswith("#"):
                  continue
              try:
                  if t.startswith("re:"):
                      rx = t[3:]
                  else:
                      sep = "[\\/]"
                      rx = "".join(sep if ch in ("\\", "/") else re.escape(ch) for ch in t)
                      if t[0].isalnum():
                          rx = r"(?<![^\W_])" + rx
                      if t[-1].isalnum():
                          rx = rx + r"(?![^\W_])"
                  rules.append((n, re.compile(rx, re.I)))
              except re.error:
                  fail("regra inv√°lida na linha %d da lista; falha fechada." % n)
          if not rules:
              fail("a lista n√£o tem nenhuma regra; falha fechada.")

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.split(b"\0")
          texts = []
          for f in files:
              if not f:
                  continue
              try:
                  with open(f, "rb") as fh:
                      texts.append(fh.read().decode("utf-8", errors="ignore"))
              except OSError:
                  pass
          base, head = os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", "")
          if base and head:
              out = subprocess.run(["git", "log", "--format=%B", base + ".." + head], capture_output=True, check=True)
              texts.append(out.stdout.decode("utf-8", errors="ignore"))

          hit = sum(1 for _, rx in rules if any(rx.search(t) for t in texts))
          print("regras lidas: %d; regras com casamento: %d; arquivos varridos: %d" % (len(rules), hit, len(texts)))
          if hit:
              fail("%d regra(s) da lista de termos proibidos casaram." % hit)
          PY

  # ---------------------------------------------------------------------------------------------------------
  # Entram depois, cada um com o gatilho que o liga. Mantenha o filtro por caminho para n„o
  # rodar o que n„o mudou, e inclua o job novo em `needs` do ci-ok.
  #
  # contracts:   gatilho = existir contracts/ com o primeiro JSON Schema.
  #              Valida os Schemas, os arquivos dourados e confere que os tipos gerados est„o em dia.
  # pty-windows: gatilho = existir ptyhost/. Um ciclo do fixture no runner Windows; sÛ se ptyhost/ mudou.
  # deps:        gatilho = existir Cargo.lock ou package-lock.json. dependency-review; sÛ se um arquivo de
  #              dependÍncias mudou.
  # artifact:    gatilho = o atualizador do daemon existir. Gera o execut·vel, o SHA-256 e a atestaÁ„o a cada junÁ„o
  #              na develop (runner Windows) e publica como prÈ-lanÁamento.
  # ---------------------------------------------------------------------------------------------------------

  # Decide, por `git diff`, quais jobs condicionais rodam. … um job (e n„o `on.paths`) para o `ci-ok` existir sempre.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filtrar por caminho
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          # Casca: ela mesma, o que ela enxerga (contracts, e2e) e tudo que muda o resultado da compilaÁ„o.
          SHELL_PATHS: '^(crates/shell/|crates/contracts/|crates/e2e/|Cargo\.lock$|Cargo\.toml$|rust-toolchain\.toml$|\.cargo/)'
        run: |
          set -euo pipefail
          # Na d˙vida (disparo manual, push sem base conhecida, diff impossÌvel), roda.
          run=true
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE_SHA...$PR_HEAD_SHA" ;;
            push)
              case "$PUSH_BEFORE_SHA" in
                ""|0000000000000000000000000000000000000000) ;;
                *) range="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA" ;;
              esac
              ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            echo "$files"
            if echo "$files" | grep -Eq "$SHELL_PATHS"; then run=true; else run=false; fi
          fi
          echo "shell=$run" >> "$GITHUB_OUTPUT"
          echo "shell-check roda: $run"

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a vers„o fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Sem --workspace de propÛsito: a casca Tauri fica de fora (default-members) e compila no job shell-check.
      - name: FormataÁ„o
        run: cargo fmt --all --check
      - name: Lint (avisos como erro)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Testes
        run: cargo test --locked
      - name: Regra de dependÍncia (testes da ferramenta e conferÍncia do grafo)
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_deps.py check
      # Vers„o fixa da ferramenta; configuraÁ„o em deny.toml (licenÁas, avisos de seguranÁa, origem).
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny
        run: cargo deny --locked check

  shell-check:
    name: shell-check
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar a vers„o fixada em rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # O Tauri embute `ui/dist` ao compilar; enquanto a interface n„o existir, uma p·gina vazia basta.
      - name: Pasta da interface
        run: |
          mkdir -p ui/dist
          [ -f ui/dist/index.html ] || echo '<!doctype html><title>ads</title>' > ui/dist/index.html
      - name: Compilar a casca (cargo check)
        run: cargo check --locked -p ads-shell --all-targets

  ci-ok:
    name: ci-ok
    if: always()
    needs: [commits, secrets, terms, changes, rust, shell-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resumir
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error::algum job falhou ou foi cancelado."
              exit 1
              ;;
          esac
