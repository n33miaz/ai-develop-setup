name: Pre-release

# Pré-lançamento de desenvolvimento quando o CI de um push na develop termina verde (ADR 0025). O CI só conclui com
# sucesso se o job ci-ok passar. Parâmetros em defaults/release.toml; numeração e plano de poda em tools/release.py,
# testado no job rust do CI. Ainda não há binário: a release leva a tag e as notas.
# O GitHub lê workflows de workflow_run da branch padrão, que neste repositório é a develop.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

# Uma execução por vez. Junções próximas podem resultar num só pré-lançamento, o do commit mais novo.
concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Código já juntado na develop; nenhum script do commit roda além de tools/release.py, que só lê arquivos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publicar
        id: publish
        run: |
          set -euo pipefail
          python3 tools/release.py config > config.txt
          cat config.txt
          if ! grep -qx 'enabled=on' config.txt; then
            echo "Pré-lançamentos desligados em defaults/release.toml."
            exit 0
          fi
          develop_head=$(gh api "repos/$REPO/commits/develop" --jq .sha)
          if [ "$develop_head" != "$HEAD_SHA" ]; then
            echo "A develop já está em $develop_head; o pré-lançamento sai para ele."
            exit 0
          fi
          git tag -l > tags.txt
          git tag --merged "$HEAD_SHA" > merged.txt
          git tag --points-at "$HEAD_SHA" > points-at.txt
          python3 tools/release.py next --sha "$HEAD_SHA" --tags tags.txt --merged merged.txt --points-at points-at.txt > next.txt
          cat next.txt
          if ! grep -qx 'publish=yes' next.txt; then
            echo "O commit já tem pré-lançamento."
            exit 0
          fi
          tag=$(sed -n 's/^tag=//p' next.txt)
          version=$(sed -n 's/^version=//p' next.txt)
          previous=$(sed -n 's/^previous=//p' next.txt)
          notes="Versão \`$version\`, do commit $HEAD_SHA. Pré-lançamento de desenvolvimento: só tag e notas, ainda sem binário."
          start=()
          if [ -n "$previous" ]; then start=(--notes-start-tag "$previous"); fi
          gh release create "$tag" --repo "$REPO" --target "$HEAD_SHA" --title "$version" \
            --prerelease --latest=false --notes "$notes" --generate-notes "${start[@]}"
          # A tag tem de apontar para o commit avaliado (se ela já existisse, o --target seria ignorado).
          target=$(gh api "repos/$REPO/commits/$tag" --jq .sha)
          if [ "$target" != "$HEAD_SHA" ]; then
            echo "::error::a tag $tag aponta para $target, não para $HEAD_SHA."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Roda também quando nada foi publicado: uma poda interrompida termina na execução seguinte.
      - name: Podar os mais antigos
        env:
          NEW_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          grep -qx 'enabled=on' config.txt || exit 0
          mode=$(sed -n 's/^prune=//p' config.txt)
          keep=$(sed -n 's/^keep=//p' config.txt)
          if [ "$mode" = "off" ]; then
            echo "Poda desligada."
            exit 0
          fi
          inventory() {
            gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq '.[] | {tagName: .tag_name, isPrerelease: .prerelease, isDraft: .draft} | tojson' > releases.jsonl
            gh api --paginate "repos/$REPO/git/matching-refs/tags/" --jq '.[] | .ref | sub("^refs/tags/"; "")' > remote-tags.txt
          }
          inventory
          python3 tools/release.py prune --releases releases.jsonl --tags remote-tags.txt --require "$NEW_TAG" > plan.txt
          {
            echo "### Poda: ficam os $keep mais novos (modo $mode)"
            echo
            echo "Cópia para recriar o que for apagado: tag e commit."
            echo
            while read -r kind tag; do
              echo "- $kind \`$tag\` → $(git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null || echo '?')"
            done < plan.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt
          if [ "$mode" != "apply" ]; then
            echo "Modo $mode: nada apagado."
            exit 0
          fi
          while read -r kind tag; do
            if [ "$kind" = "release" ]; then
              # Confere de novo cada alvo antes de apagar: ainda pré-lançamento e não rascunho.
              current=$(gh api "repos/$REPO/releases/tags/$tag" --jq '"\(.id) \(.prerelease) \(.draft)"')
              read -r id prerelease draft <<< "$current"
              if [ "$prerelease" != "true" ] || [ "$draft" != "false" ]; then
                echo "::error::a release $tag mudou de estado; não foi apagada."
                exit 1
              fi
              gh api -X DELETE "repos/$REPO/releases/$id" > /dev/null
            else
              # Tag só sai sem release ligada a ela.
              if gh api "repos/$REPO/releases/tags/$tag" > /dev/null 2>&1; then
                echo "::error::a tag $tag ainda tem release; não foi apagada."
                exit 1
              fi
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" > /dev/null
            fi
          done < plan.txt
          # Nova conferência sobre o inventário completo: nada mais a podar.
          inventory
          python3 tools/release.py prune --releases releases.jsonl --tags remote-tags.txt --require "$NEW_TAG" > left.txt
          if [ -s left.txt ]; then
            echo "::error::a poda deixou sobras:"
            cat left.txt
            exit 1
          fi
